name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.10 is legacy compatibility; 3.14 exercises the maintained core runtime.
        python-version: ["3.10", "3.11", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install -e . pytest pytest-asyncio ruff
      - name: Run tests
        run: pytest tests
      - name: Lint
        run: ruff check .

  real-sdk-authorization:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
        dependencies: [minimum, latest]
    env:
      HAYSTACK_TELEMETRY_ENABLED: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e . pytest pytest-asyncio
      - if: matrix.dependencies == 'minimum'
        name: Check component contract on declared minimum
        run: |
          pip install 'haystack-ai==2.3.1'
          pytest tests
      - if: matrix.dependencies == 'minimum'
        name: Install minimum native async pipeline test version
        run: pip install 'haystack-ai==2.20.0'
      - run: pytest integration_tests

  wheel-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install hash-locked release build tools
        run: |
          python -m venv "$RUNNER_TEMP/release-tools"
          "$RUNNER_TEMP/release-tools/bin/python" -m pip install --require-hashes -r ci/release-build-requirements.txt
          "$RUNNER_TEMP/release-tools/bin/python" -m pip check
          "$RUNNER_TEMP/release-tools/bin/python" -m pip --version
          "$RUNNER_TEMP/release-tools/bin/python" -m pip list --format=freeze
      - run: |
          "$RUNNER_TEMP/release-tools/bin/python" -m build --no-isolation && "$RUNNER_TEMP/release-tools/bin/python" -m twine check dist/* && python scripts/check_release.py
      - name: Clean wheel imports
        run: |
          python -m venv "$RUNNER_TEMP/wheel-smoke"
          "$RUNNER_TEMP/wheel-smoke/bin/pip" install dist/*.whl
          "$RUNNER_TEMP/wheel-smoke/bin/python" -I -c "import haystack_integrations.components.filters.ferpa_filter as p; from haystack_integrations.components.filters.ferpa_filter.__about__ import __version__; from importlib.metadata import version; assert __version__ == version('ferpa-haystack'); assert all(hasattr(p, name) for name in p.__all__)"
